<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>viper</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --border: #1f2735;
    --text: #d7dee9; --dim: #6b7688; --accent: #4f9cf9; --user: #1b3a5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.55 "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  #stats { color: var(--dim); font-size: 12px; margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.asst { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.sys  { align-self: center; background: none; color: var(--dim); font-size: 12px; padding: 2px 8px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent);
            vertical-align: -2px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #in {
    flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font: inherit; resize: none; outline: none;
  }
  #in:focus { border-color: var(--accent); }
  button {
    background: var(--accent); border: none; color: #04121f; font-weight: 600;
    padding: 0 18px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header>
  <h1><span>viper</span> — Nanbeige4.2-3B on RTX 3070 Ti</h1>
  <div id="stats">idle</div>
</header>
<div id="chat"><div class="msg sys">engine warming up…</div></div>
<div id="bar">
  <textarea id="in" rows="2" placeholder="message… (Enter to send, Shift+Enter for newline)"></textarea>
  <button id="send">send</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('in');
const sendBtn = document.getElementById('send');
const stats = document.getElementById('stats');

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.disabled = sendBtn.disabled = true;
  addMsg('user', text);
  const box = addMsg('asst', '');
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  box.appendChild(cursor);

  const t0 = performance.now();
  let first = null, ntok = 0, out = '';
  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: 'nanbeige4.2-3b',
        messages: [{role: 'user', content: text}],
        stream: true, max_tokens: 512, temperature: 0.7
      })
    });
    if (!resp.ok) { cursor.remove(); box.textContent = '[server error ' + resp.status + ']'; return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const ev = buf.slice(0, idx); buf = buf.slice(idx + 2);
        for (const line of ev.split('\n')) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            const delta = j.choices?.[0]?.delta?.content ?? '';
            if (delta) {
              if (first === null) first = performance.now();
              out += delta; ntok++;
              box.firstChild.textContent = out;
              box.appendChild(cursor);
              chat.scrollTop = chat.scrollHeight;
            }
          } catch (_) {}
        }
      }
    }
    const t1 = performance.now();
    const ttft = first ? ((first - t0) / 1000).toFixed(2) : '?';
    const tps = first ? (ntok / ((t1 - first) / 1000)).toFixed(1) : '?';
    stats.textContent = `${ntok} tok · ${tps} tok/s · ttft ${ttft}s`;
  } catch (e) {
    box.textContent = out + '\n[error: ' + e.message + ']';
  } finally {
    cursor.remove();
    input.disabled = sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.onclick = send;
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.focus();

// Drop the warmup notice once the page is alive.
fetch('/v1/models').then(r => r.json()).then(() => {
  const s = chat.querySelector('.msg.sys'); if (s) s.textContent = 'ready.';
}).catch(() => {
  const s = chat.querySelector('.msg.sys'); if (s) s.textContent = 'server unreachable.';
});
</script>
</body>
</html>
