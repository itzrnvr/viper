<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>viper chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg: #0e0e10;
    --bg-elev: #18181b;
    --fg: #e6e6e6;
    --fg-dim: #9a9a9a;
    --accent: #4ade80;
    --accent-dim: #1a3a25;
    --border: #2a2a2d;
    --user-bubble: #1f3a26;
    --assistant-bubble: #1a1a1d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--bg-elev);
  }
  header .logo {
    width: 28px; height: 28px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
  }
  header .title { font-weight: 600; font-size: 15px; letter-spacing: 0.2px; }
  header .sub { color: var(--fg-dim); font-size: 12px; margin-left: auto; }
  header .status { color: var(--accent); font-size: 12px; }
  header .status.off { color: var(--fg-dim); }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    margin: 10px 0;
    padding: 12px 16px;
    border-radius: 10px;
    max-width: 100%;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user { background: var(--user-bubble); align-self: flex-end; }
  .msg.assistant { background: var(--assistant-bubble); border: 1px solid var(--border); }
  .msg.system { color: var(--fg-dim); font-size: 12px; text-align: center; background: transparent; }
  .role {
    font-size: 11px;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  pre, code {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    background: #0a0a0c;
    border-radius: 6px;
  }
  code { padding: 2px 5px; color: #f8f8f2; }
  pre { padding: 10px 12px; overflow-x: auto; }
  footer {
    border-top: 1px solid var(--border);
    padding: 14px 22px;
    background: var(--bg-elev);
  }
  .input-wrap {
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    height: 50px;
    max-height: 200px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #0e0e10;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    height: 50px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { background: var(--accent-dim); color: var(--fg-dim); cursor: not-allowed; }
  .controls {
    display: flex; gap: 12px; align-items: center; margin-bottom: 8px;
    font-size: 12px; color: var(--fg-dim);
  }
  .controls label { display: flex; gap: 5px; align-items: center; }
  .controls input[type="number"] {
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 12px;
  }
  .typing { color: var(--fg-dim); font-style: italic; }
  .typing::after {
    content: "...";
    animation: blink 1.2s steps(3, end) infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
</style>
</head>
<body>
<header>
  <div class="logo">v</div>
  <div class="title">viper</div>
  <div class="sub" id="modelName">Nanbeige4.2-3B</div>
  <div class="status off" id="status">connecting</div>
</header>
<main id="messages">
  <div class="msg system">viper v1 — single-stream inference on RTX 3070 Ti. Type a prompt and press Send.</div>
</main>
<footer>
  <div class="controls">
    <label>temp <input type="number" id="temp" value="0.6" step="0.1" min="0" max="2" style="width:60px"></label>
    <label>max tokens <input type="number" id="maxTokens" value="256" step="32" min="1" max="4096" style="width:70px"></label>
    <label>top-p <input type="number" id="topP" value="0.95" step="0.05" min="0" max="1" style="width:60px"></label>
    <label>top-k <input type="number" id="topK" value="20" step="1" min="0" max="200" style="width:55px"></label>
    <label style="margin-left:auto"><input type="checkbox" id="streamChk" checked> stream</label>
    <button id="clearBtn" style="background:transparent;color:var(--fg-dim);border:1px solid var(--border);">clear</button>
  </div>
  <div class="input-wrap">
    <textarea id="input" placeholder="Message viper…" rows="1"></textarea>
    <button id="sendBtn">Send</button>
  </div>
</footer>
<script>
const messages = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const clearBtn = document.getElementById('clearBtn');
const status = document.getElementById('status');

function setStatus(text, ok) {
  status.textContent = text;
  status.className = ok ? 'status' : 'status off';
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  const r = document.createElement('div');
  r.className = 'role';
  r.textContent = role === 'user' ? 'you' : role === 'assistant' ? 'viper' : '';
  el.appendChild(r);
  if (role === 'system') {
    el.textContent = text;
  } else {
    const body = document.createElement('div');
    body.textContent = text;
    el.appendChild(body);
  }
  messages.appendChild(el);
  messages.scrollTop = messages.scrollHeight;
  return el;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  const stream = document.getElementById('streamChk').checked;
  const body = {
    model: 'Nanbeige4.2-3B',
    messages: [{ role: 'user', content: text }],
    temperature: parseFloat(document.getElementById('temp').value),
    top_p: parseFloat(document.getElementById('topP').value),
    max_tokens: parseInt(document.getElementById('maxTokens').value),
    stream: stream,
  };
  addMsg('user', text);
  input.value = '';
  input.style.height = '50px';
  sendBtn.disabled = true;
  const assistantEl = addMsg('assistant', '');
  const bodyEl = assistantEl.querySelector('div:last-child');
  bodyEl.innerHTML = '<span class="typing"></span>';

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const errText = await resp.text();
      bodyEl.textContent = 'error: ' + errText;
      setStatus('error', false);
      return;
    }
    setStatus('streaming', true);
    if (stream && resp.headers.get('content-type') && resp.headers.get('content-type').includes('event-stream')) {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';
      let full = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') { setStatus('ready', true); break; }
          try {
            const j = JSON.parse(data);
            const delta = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (delta) { full += delta; bodyEl.textContent = full; messages.scrollTop = messages.scrollHeight; }
          } catch (e) {}
        }
      }
    } else {
      const j = await resp.json();
      const content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || JSON.stringify(j);
      bodyEl.textContent = content;
      setStatus('ready', true);
    }
  } catch (e) {
    bodyEl.textContent = 'connection error: ' + e.message;
    setStatus('offline', false);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = '50px';
  input.style.height = Math.min(200, input.scrollHeight) + 'px';
});
clearBtn.addEventListener('click', () => { messages.innerHTML = '<div class="msg system">cleared</div>'; });

fetch('/').then(r => r.json()).then(j => setStatus('ready', true)).catch(() => setStatus('offline', false));
</script>
</body>
</html>
